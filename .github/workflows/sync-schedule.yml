name: Sync Ameego Schedule

on:
  # Every day at 11:00 PM Central Time (Winnipeg) = 04:00 UTC the next day,
  # while Manitoba is on Daylight Time (CDT, UTC-5). Central switches to
  # Standard Time (CST, UTC-6) in November -- when that happens this will
  # quietly start firing at 10:00 PM local instead of 11:00 PM, until the
  # line below is changed to "0 5 * * *". Ping me in November and I'll
  # remind you / update it.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          AMEEGO_USERNAME: ${{ secrets.AMEEGO_USERNAME }}
          AMEEGO_PASSWORD: ${{ secrets.AMEEGO_PASSWORD }}
          AMEEGO_CLIENT_ID: ${{ secrets.AMEEGO_CLIENT_ID }}
        run: python scrape_schedule.py

      # Runs whether the step above succeeded or failed, so we always get
      # to see what the script saw.
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: debug/
          retention-days: 7

      - name: Upload calendar file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-file
          path: my-shifts.ics
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated calendar file to the repo
        if: success()
        run: |
          if [ -f my-shifts.ics ]; then
            git config user.name "ameego-sync-bot"
            git config user.email "actions@github.com"
            git add my-shifts.ics
            git commit -m "Update schedule" || echo "No changes to commit"
            git push
          fi
